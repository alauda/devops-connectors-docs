---
# PoC-1 Tekton Task: Vault 模式下 client 容器内可见原始 PAT 的演示
# 命名空间：devops-valult-invest
# 目标：
#   step-1 用 Pod 自己的 SA token 走 Vault Kubernetes Auth 拿 vault token，
#          再读 secret/git/test，把 token 落到 workspace 文件 .git-token。
#   step-2 模拟 "CI client 容器"，用 cat / env / 拼 URL 等多种方式触达明文 PAT，
#          证明 client 进程地址空间内可见原始凭据。
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: poc-vault-secretless
  namespace: devops-valult-invest
spec:
  workspaces:
    - name: shared
      description: 模拟 Tekton workspace（emptyDir），存放从 Vault 拉到的 token 文件
  steps:
    # ---------- Step 1: fetch-from-vault ----------
    - name: fetch-from-vault
      image: hub-mirrors.alauda.cn/hashicorp/vault:1.19
      env:
        - name: VAULT_ADDR
          value: http://vault.devops-valult-invest.svc:8200
      script: |
        #!/bin/sh
        # 说明：
        #  - Tekton 会在 script 块里展开 $(workspaces.xxx)，所以普通 shell 命令替换避开 $(...)，
        #    全部改用反引号 ``，否则 Tekton 把 $(echo ...) 当未知变量替换为空字符串。
        #  - 不用 `vault read` / `vault kv get`：这两条命令会先调 sys/internal/ui/mounts，
        #    在 OSS Vault + K8s auth + 非 root token 场景偶发 "no namespace" 500。
        #    直接走 HTTP API（wget + X-Vault-Token）最稳。
        set -eu
        WS="$(workspaces.shared.path)"
        VADDR="$VAULT_ADDR"

        echo "[fetch-from-vault] 1) 读取 Pod 自己的 SA projected token"
        SA_JWT_TOKEN=`cat /var/run/secrets/kubernetes.io/serviceaccount/token`
        echo "  SA token length=`echo -n "$SA_JWT_TOKEN" | wc -c`"

        echo "[fetch-from-vault] 2) 调 auth/kubernetes/login 换 vault client_token"
        vault write -format=json auth/kubernetes/login role=git-reader jwt="$SA_JWT_TOKEN" > /tmp/login.json
        VT=`grep client_token /tmp/login.json | cut -d'"' -f4`
        echo "  got vault client_token length=`echo -n "$VT" | wc -c`"

        echo "[fetch-from-vault] 3) 直接 HTTP GET 读 secret/data/git/test 拿真实 PAT"
        wget -qO /tmp/secret.json --header="X-Vault-Token: $VT" \
            "$VADDR/v1/secret/data/git/test"
        # 解析 .data.data.token （KV v2 嵌套结构）
        PAT=`sed 's/.*"token":"\([^"]*\)".*/\1/' /tmp/secret.json`

        echo "[fetch-from-vault] 4) 把 PAT 物化到 workspace 文件（Vault 模式必经动作）"
        printf '%s' "$PAT" > "$WS/.git-token"
        chmod 600 "$WS/.git-token"
        ls -l "$WS/.git-token"
        echo "[fetch-from-vault] done. token bytes written: `wc -c < "$WS/.git-token"`"

    # ---------- Step 2: use-token (模拟 client 容器) ----------
    - name: use-token
      image: hub-mirrors.alauda.cn/library/alpine:3.20
      env:
        # 故意把 token 经由 env 注入（Vault Agent / envconsul 典型形态）
        - name: GIT_TOKEN_FROM_ENV_DEMO
          value: "will-be-overwritten-below"
      script: |
        #!/bin/sh
        set -eux
        WS="$(workspaces.shared.path)"
        echo "===== [use-token] A. cat 文件即得明文 PAT ====="
        cat "$WS/.git-token"; echo

        echo "===== [use-token] B. env 注入路径（Vault Agent 典型用法）====="
        TOK=`cat "$WS/.git-token"`
        export GIT_TOKEN_FROM_ENV_DEMO="$TOK"
        env | grep -iE 'token|secret|vault' || true

        echo "===== [use-token] C. 拼 URL（真实泄漏到 process args/log）====="
        # 仅 echo，不执行真的 git clone
        echo "git clone https://oauth:$TOK@gitea.example.com/foo/bar.git"

        echo "===== [use-token] D. ps -ef 抓进程 args 也带 token ====="
        # 起一个 sleep 进程把 token 放到 argv，演示 /proc/<pid>/cmdline 泄漏
        sh -c "exec -a fake-git-with-secret-$TOK sleep 1" &
        sleep 0.2
        ps -ef | grep fake-git || true
        wait

        echo "===== [use-token] 结论: Vault 模式下 client 容器对原始 PAT 完全可见 ====="

---
# PipelineRun 触发上面的 Task；用 emptyDir 模拟共享 workspace
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: poc-vault-secretless-run
  namespace: devops-valult-invest
spec:
  taskRunTemplate:
    serviceAccountName: default
  workspaces:
    - name: shared
      emptyDir: {}
  pipelineSpec:
    workspaces:
      - name: shared
    tasks:
      - name: demo
        taskRef:
          name: poc-vault-secretless
        workspaces:
          - name: shared
            workspace: shared
