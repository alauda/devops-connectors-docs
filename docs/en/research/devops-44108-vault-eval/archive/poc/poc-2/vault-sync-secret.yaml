# PoC-2: Vault → K8s dockerconfigjson Secret sync 最小可行替身
#
# 目的：模拟 Vault Secrets Operator (VSO) / External Secrets Operator (ESO) 在
# K8s 镜像拉取问题域上的全部能力 —— **同步一份 dockerconfigjson 类型的 Secret
# 到目标 ns**。不安装真的 VSO（避免引入 helm 依赖）；直接用一个 Job：
#   1) 走 Vault Kubernetes auth 拿短期 vault token
#   2) 读 secret/data/registry/dummy 的 dockerconfigjson 字段
#   3) 调 K8s API 创建 / 更新一个 type=kubernetes.io/dockerconfigjson 的 Secret
#
# 关键观察：即便这个同步 100% 成功，下游业务 Pod 仍必须显式 `imagePullSecrets:
# - name: vault-synced-dockercfg`；否则 kubelet 不会用它（见 test-pods.yaml 场景 1）。
# 这就是 PoC-2 要证伪的"Vault 能让 Pod 不持有 imagePullSecret 也能拉镜像"。

---
# 1. 给同步 Job 用的 SA（独立于 ns/default，便于绑定最小 RBAC）
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-image-sync
  namespace: devops-valult-invest
---
# 2. RBAC：允许该 SA 在本 ns 创建 / 更新 / 读取 Secret
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-image-sync-secret-writer
  namespace: devops-valult-invest
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-image-sync-secret-writer
  namespace: devops-valult-invest
subjects:
  - kind: ServiceAccount
    name: vault-image-sync
    namespace: devops-valult-invest
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-image-sync-secret-writer
---
# 3. 同步脚本本体（Python，依赖标准库 urllib + json + base64 + ssl）
#    放在 ConfigMap 里方便 Pod 直接挂卷执行；不嵌进 command 是为了避免 YAML
#    转义和 sed 解析 JSON 的脆弱性（上一轮就是吃了这亏）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-image-sync-script
  namespace: devops-valult-invest
data:
  sync.py: |
    """PoC-2: 模拟 Vault Secrets Operator 同步 dockerconfigjson 到 K8s Secret。

    流程：
      1. 用 Pod 的 SA token + role 走 vault kubernetes auth login，拿短期 vault token
      2. 读 secret/data/registry/dummy（kv v2），取 dockerconfigjson 字段
      3. 调 K8s API 在 ns 内 create/update 一个 dockerconfigjson 类型的 Secret

    本脚本只用 Python 标准库，确保任何 python:3-alpine 都能跑。
    """
    import base64
    import json
    import os
    import ssl
    import sys
    import urllib.request

    VAULT_ADDR = os.environ["VAULT_ADDR"]
    VAULT_ROLE = os.environ["VAULT_ROLE"]
    TARGET_NS = os.environ["TARGET_NAMESPACE"]
    TARGET_NAME = os.environ["TARGET_SECRET_NAME"]
    SA_TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    SA_CA_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    KUBE_API = "https://kubernetes.default.svc"


    def http(method, url, headers=None, data=None, ctx=None):
        if data is not None and not isinstance(data, bytes):
            data = data.encode()
        req = urllib.request.Request(url, data=data, method=method, headers=headers or {})
        try:
            with urllib.request.urlopen(req, context=ctx) as resp:
                return resp.status, resp.read().decode()
        except urllib.error.HTTPError as e:
            return e.code, e.read().decode()


    def main():
        with open(SA_TOKEN_PATH) as f:
            sa_jwt = f.read().strip()

        # --- 1. vault login ---
        print(f"[vault-image-sync] step 1: POST {VAULT_ADDR}/v1/auth/kubernetes/login (role={VAULT_ROLE})")
        code, body = http(
            "POST",
            f"{VAULT_ADDR}/v1/auth/kubernetes/login",
            headers={"Content-Type": "application/json"},
            data=json.dumps({"role": VAULT_ROLE, "jwt": sa_jwt}),
        )
        if code != 200:
            print(f"FATAL vault login HTTP {code}: {body}", file=sys.stderr)
            sys.exit(1)
        login = json.loads(body)
        vtoken = login["auth"]["client_token"]
        print(f"[vault-image-sync] got vault token; policies={login['auth']['policies']} lease={login['auth']['lease_duration']}s")

        # --- 2. read vault kv v2 ---
        print(f"[vault-image-sync] step 2: GET {VAULT_ADDR}/v1/secret/data/registry/dummy")
        code, body = http(
            "GET",
            f"{VAULT_ADDR}/v1/secret/data/registry/dummy",
            headers={"X-Vault-Token": vtoken},
        )
        if code != 200:
            print(f"FATAL vault read HTTP {code}: {body}", file=sys.stderr)
            sys.exit(1)
        dockercfg = json.loads(body)["data"]["data"]["dockerconfigjson"]
        print(f"[vault-image-sync] dockerconfigjson preview={dockercfg[:120]}")

        # --- 3. create / update K8s Secret ---
        ctx = ssl.create_default_context(cafile=SA_CA_PATH)
        with open(SA_TOKEN_PATH) as f:
            kube_jwt = f.read().strip()
        secret_body = {
            "apiVersion": "v1",
            "kind": "Secret",
            "metadata": {
                "name": TARGET_NAME,
                "namespace": TARGET_NS,
                "annotations": {
                    "poc-2.devops-44108/source": "vault:secret/data/registry/dummy",
                    "poc-2.devops-44108/sync-mode": "VSO-equivalent-job",
                },
            },
            "type": "kubernetes.io/dockerconfigjson",
            "data": {
                ".dockerconfigjson": base64.b64encode(dockercfg.encode()).decode(),
            },
        }
        headers = {
            "Authorization": f"Bearer {kube_jwt}",
            "Content-Type": "application/json",
        }
        print(f"[vault-image-sync] step 3: POST kube Secret {TARGET_NS}/{TARGET_NAME}")
        code, body = http(
            "POST",
            f"{KUBE_API}/api/v1/namespaces/{TARGET_NS}/secrets",
            headers=headers,
            data=json.dumps(secret_body),
            ctx=ctx,
        )
        print(f"[vault-image-sync] create HTTP {code}")
        if code == 409:
            print("[vault-image-sync] secret exists, PUT update")
            code, body = http(
                "PUT",
                f"{KUBE_API}/api/v1/namespaces/{TARGET_NS}/secrets/{TARGET_NAME}",
                headers=headers,
                data=json.dumps(secret_body),
                ctx=ctx,
            )
            print(f"[vault-image-sync] update HTTP {code}")
        if code not in (200, 201):
            print(f"FATAL kube API HTTP {code}: {body}", file=sys.stderr)
            sys.exit(1)
        print("[vault-image-sync] DONE.")


    if __name__ == "__main__":
        main()
---
# 4. 同步 Job —— 一次性执行 VSO 等价逻辑
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-image-sync
  namespace: devops-valult-invest
spec:
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: vault-image-sync
      restartPolicy: Never
      volumes:
        - name: script
          configMap:
            name: vault-image-sync-script
      containers:
        - name: sync
          image: hub-mirrors.alauda.cn/library/python:3-alpine
          env:
            - name: VAULT_ADDR
              value: "http://vault.devops-valult-invest.svc:8200"
            - name: VAULT_ROLE
              value: "image-puller"
            - name: TARGET_SECRET_NAME
              value: "vault-synced-dockercfg"
            - name: TARGET_NAMESPACE
              value: "devops-valult-invest"
          volumeMounts:
            - name: script
              mountPath: /script
          command:
            - python3
            - /script/sync.py
